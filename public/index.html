<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Sleek, high-performance barbell plate calculator for the gym. Visualize plate loading with instant math and offline support.">
  <meta name="theme-color" content="#08090c">
  <title>Barbell Plate Calculator</title>

  <!-- Favicons & Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Apple Mobile Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlateCalc">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Ambient background glow -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <img src="favicon.svg" alt="PlateCalc logo" class="header-icon" width="24" height="24">
        <h1>PLATECALC</h1>
      </div>
    </header>

    <main>
      <!-- Controls Glass Card -->
      <section class="glass-card controls-card" aria-label="Calculator Inputs">
        <!-- Equipment Selector (Dropdown) -->
        <div class="form-group equipment-group">
          <div class="custom-dropdown" id="bar-dropdown-container">
            <button
              type="button"
              class="dropdown-trigger"
              id="bar-dropdown-trigger"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="bar-dropdown-menu"
              aria-label="Select Barbell or Machine"
            >
              <div class="trigger-left">
                <svg class="equipment-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m6.5 6.5 11 11"/>
                  <path d="m21 21-1-1"/>
                  <path d="m3 3 1 1"/>
                  <path d="m18 22 4-4"/>
                  <path d="m2 6 4-4"/>
                  <path d="m3 10 7-7"/>
                  <path d="m14 21 7-7"/>
                </svg>
                <span class="trigger-name" id="dropdown-current-name">Straight Bar</span>
              </div>
              <div class="trigger-right">
                <span class="trigger-weight-badge" id="dropdown-current-weight">45 lb</span>
                <svg class="trigger-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </button>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu hidden" id="bar-dropdown-menu" role="listbox" aria-label="Available Equipment">
              <div class="dropdown-options-list" id="bar-options-list">
                <!-- Populated dynamically: Built-ins + Custom machines -->
              </div>
              <div class="dropdown-footer">
                <button type="button" class="dropdown-add-btn" id="open-add-modal-btn">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  <span>Add Bar / Machine</span>
                </button>
              </div>
            </div>
          </div>
          <!-- Hidden fallback select for accessibility -->
          <select id="bar-select" class="visually-hidden" aria-hidden="true" tabindex="-1"></select>
        </div>

        <!-- Target Weight Input with Steppers -->
        <div class="form-group" style="margin-top: 10px;">
          <div class="weight-input-container">
            <button type="button" class="stepper-btn" id="step-down-btn" aria-label="Decrease weight by 5 pounds" title="-5 lb (Shift: -25 lb)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>

            <div class="weight-display-wrapper">
              <input
                type="number"
                id="target-weight"
                class="input-weight"
                min="0"
                step="any"
                inputmode="decimal"
                placeholder="135"
                aria-label="Target Weight in pounds"
                autofocus
              >
              <span class="weight-unit-badge">LB</span>
            </div>

            <button type="button" class="stepper-btn" id="step-up-btn" aria-label="Increase weight by 5 pounds" title="+5 lb (Shift: +25 lb)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>

        <!-- Clear Action -->
        <div class="clear-row">
          <button type="button" id="clear-btn" class="clear-btn" title="Clear weight input">Clear</button>
        </div>

        <!-- Hidden submit for Enter key support -->
        <form id="calc-form" style="display: none;"><button type="submit" id="calc-btn"></button></form>
      </section>

      <!-- Empty State -->
      <section id="empty-state" class="glass-card state-card empty-state" aria-live="polite">
        <p class="state-title">Choose a bar and enter your target weight</p>
      </section>

      <!-- Error State -->
      <section id="error-container" class="glass-card state-card error-state hidden" aria-live="assertive">
        <p id="error-message" class="error-message"></p>
        <div id="error-closest" class="error-closest"></div>
      </section>

      <!-- Results Glass Card -->
      <section id="results-container" class="glass-card results-card hidden" aria-live="polite">
        <!-- Results Header -->
        <div class="result-header">
          <div class="res-badge-wrap">
            <span id="res-side-weight" class="res-side-badge">135 lb per side</span>
          </div>
          <div id="res-bar-name" class="res-bar-name">Straight Bar (45 lb)</div>
        </div>

        <!-- Barbell Visualization Stage -->
        <div class="barbell-stage" aria-hidden="true">
          <div class="barbell" id="barbell-visual">
            <div class="sleeve sleeve-left">
              <div class="plates plates-left" id="barbell-plates-left"></div>
            </div>
            <div class="bar-collar collar-left" aria-hidden="true"></div>
            <div class="bar-shaft" aria-hidden="true">
              <div class="knurl knurl-left"></div>
              <div class="knurl knurl-right"></div>
            </div>
            <div class="bar-collar collar-right" aria-hidden="true"></div>
            <div class="sleeve sleeve-right">
              <div class="plates plates-right" id="barbell-plates-right"></div>
            </div>
          </div>
        </div>

        <!-- Compact Summary & Breakdown -->
        <div class="breakdown-container">
          <div class="summary-chips-row">
            <div class="summary-chip">
              <span class="chip-label">Side:</span>
              <span id="summary-loaded-per-side" class="chip-val highlight">135 lb</span>
            </div>
            <div class="summary-chip">
              <span class="chip-label">Bar:</span>
              <span id="summary-bar-weight" class="chip-val">45 lb</span>
            </div>
            <div class="summary-chip">
              <span class="chip-label">Plates:</span>
              <span id="breakdown-total-plates" class="chip-val">6</span>
            </div>
            <div class="summary-chip total-chip">
              <span class="chip-label">Total:</span>
              <span id="summary-total-weight" class="chip-val total-val">315 lb</span>
            </div>
          </div>

          <!-- Each Side Plate Badges -->
          <div class="breakdown-side-section">
            <span class="breakdown-side-label">Each Side:</span>
            <ul id="breakdown-list" class="breakdown-badges-list">
              <!-- Populated dynamically by js/app.js -->
            </ul>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>a <a href="https://www.robertbrockie.com" target="_blank" rel="noopener noreferrer">robert brockie</a> production</p>
    </footer>
  </div>

  <!-- Add Equipment Modal -->
  <div id="add-equipment-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Add Equipment</h2>
        <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="add-equipment-form" novalidate>
        <div class="modal-field">
          <label for="new-equip-name" class="modal-label">Equipment Name</label>
          <input
            type="text"
            id="new-equip-name"
            class="modal-input"
            placeholder="e.g. Hack Squat, Leg Press"
            maxlength="32"
            autocomplete="off"
            required
          >
        </div>
        <div class="modal-field">
          <label for="new-equip-weight" class="modal-label">Starting Sled / Bar Weight (lb)</label>
          <div class="modal-input-wrapper">
            <input
              type="number"
              id="new-equip-weight"
              class="modal-input"
              placeholder="e.g. 105"
              min="1"
              max="2000"
              step="any"
              inputmode="decimal"
              required
            >
            <span class="modal-unit-badge">LB</span>
          </div>
        </div>
        <div id="modal-error-msg" class="modal-error hidden" role="alert"></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn modal-btn-ghost" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="modal-btn modal-btn-primary" id="modal-submit-btn">Save Equipment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
